<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>TOEIC Practice Quiz</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 4px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      .header p {
        font-size: 1.2rem;
        opacity: 0.9;
      }

      .main-menu {
        background: #f8f9fa;
        padding: 40px;
        text-align: center;
      }

      .main-menu h2 {
        margin-bottom: 30px;
        color: #495057;
      }

      .button-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .btn {
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        min-width: 150px;
      }

      .btn-primary {
        background: linear-gradient(45deg, #007bff, #0056b3);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4);
      }

      .btn-success {
        background: linear-gradient(45deg, #28a745, #1e7e34);
        color: white;
      }

      .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
      }

      .btn-info {
        background: linear-gradient(45deg, #17a2b8, #117a8b);
        color: white;
      }

      .btn-info:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(23, 162, 184, 0.4);
      }

      .btn-warning {
        background: linear-gradient(45deg, #ffc107, #e0a800);
        color: #212529;
      }

      .btn-warning:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
      }

      .btn-secondary {
        background: linear-gradient(45deg, #6c757d, #495057);
        color: white;
      }

      .btn-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
      }

      .quiz-container {
        display: none;
        padding: 4px;
      }

      .quiz-header {
        background: #e9ecef;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
      }

      .quiz-progress {
        font-size: 1.1rem;
        font-weight: 600;
        color: #495057;
      }

      .quiz-controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .quiz-controls .btn {
        padding: 8px 16px;
        font-size: 14px;
        min-width: auto;
      }

      .question-group {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 25px;
        border-left: 5px solid #007bff;
      }

      .question-group h3 {
        color: #007bff;
        margin-bottom: 20px;
        font-size: 1.4rem;
      }

      .answer-key-group {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 25px;
        margin-bottom: 25px;
        border-left: 5px solid #007bff;
      }

      .answer-key-group h3 {
        color: #007bff;
        margin-bottom: 20px;
        font-size: 1.4rem;
      }

      .passage {
        background: white;
        padding: 4px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #dee2e6;
        white-space: pre-line;
        line-height: 1.8;
      }

      .question {
        background: white;
        border-radius: 8px;
        padding: 4px;
        margin-bottom: 15px;
        border: 1px solid #dee2e6;
      }

      .question h4 {
        color: #495057;
        margin-bottom: 15px;
        font-size: 1.1rem;
      }

      .answer-key-question {
        background: white;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
        border: 1px solid #dee2e6;
      }

      .answer-key-question h4 {
        color: #495057;
        margin-bottom: 10px;
        font-size: 1rem;
      }

      .options {
        display: grid;
        gap: 10px;
      }

      .option {
        display: flex;
        align-items: center;
        padding: 10px 15px;
        border: 2px solid #e9ecef;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .option:hover {
        border-color: #007bff;
        background: #f8f9ff;
      }

      .option input[type="radio"] {
        margin-right: 10px;
        transform: scale(1.2);
      }

      .option.correct {
        border-color: #28a745;
        background: #d4edda;
        color: #155724;
      }

      .option.incorrect {
        border-color: #dc3545;
        background: #f8d7da;
        color: #721c24;
      }

      .option.not-selected {
        opacity: 0.6;
      }

      .correct-answer {
        background: #d4edda;
        color: #155724;
        padding: 8px 12px;
        border-radius: 5px;
        font-weight: 600;
        border: 1px solid #c3e6cb;
        margin-top: 10px;
      }

      .navigation-controls {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
      }

      .results-summary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        border-radius: 10px;
        margin: 25px 0;
        text-align: center;
      }

      .results-summary h3 {
        font-size: 1.8rem;
        margin-bottom: 15px;
      }

      .score {
        font-size: 2.5rem;
        font-weight: bold;
        margin: 15px 0;
      }

      .loading {
        text-align: center;
        padding: 50px;
        font-size: 1.2rem;
        color: #6c757d;
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 20px;
        border-radius: 8px;
        margin: 20px 0;
        text-align: center;
      }

        .container {
          margin: 4px;

        .answer-key-group {
          padding: 4px;
        }

        .header h1 {
          font-size: 2rem;
        }

        .button-group {
          flex-direction: column;
          align-items: center;
        }

        .btn {
          width: 200px;
        }

        .quiz-header {
          flex-direction: column;
          text-align: center;
        }

        .quiz-controls {
          justify-content: center;
        }

        .passage {
          font-size: 14px;
        }
        .question {
          font-size: 14px;
        }
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>TOEIC Practice Quiz</h1>
        <p>Test your English skills with authentic TOEIC questions</p>
      </div>

      <!-- Main Menu -->
      <div class="main-menu" id="mainMenu">
        <h2>Select Quiz Options</h2>
        <div class="button-group">
          <button class="btn btn-primary" onclick="startQuizRange(1, 10)">
            Groups 1–10
          </button>
          <button class="btn btn-success" onclick="startQuizRange(11, 20)">
            Groups 11–20
          </button>
          <button class="btn btn-info" onclick="startQuizRange(21, 30)">
            Groups 21–30
          </button>
          <button class="btn btn-info" onclick="startQuizRange(31, 40)">
            Groups 31–40
          </button>
          <button class="btn btn-info" onclick="startQuizRange(41, 50)">
            Groups 41–50
          </button>
          <button class="btn btn-info" onclick="startQuizRange(51, 57)">
            Groups 51–57
          </button>
          <button class="btn btn-warning" onclick="startQuiz('all')">
            All Groups
          </button>
        </div>
        <div class="button-group">
          <button class="btn btn-secondary" onclick="showAllAnswers()">
            View All Answers
          </button>
        </div>
        <div id="loadingMessage" class="loading">
          <p>
            TOEIC data loaded! Select the number of groups to start your
            practice quiz.
          </p>
        </div>
      </div>

      <!-- All Answers View Container -->
      <div
        class="quiz-container"
        id="allAnswersContainer"
        style="display: none"
      >
        <div class="quiz-header">
          <div class="quiz-progress">All Groups - Answer Key</div>
          <div class="quiz-controls">
            <button class="btn btn-secondary" onclick="showMainMenu()">
              Home
            </button>
          </div>
        </div>

        <div id="allAnswersContent"></div>
      </div>

      <!-- Quiz Container -->
      <div class="quiz-container" id="quizContainer">
        <div class="quiz-header">
          <div class="quiz-progress" id="progressInfo">Group 1 of 5</div>
          <div class="quiz-controls">
            <button class="btn btn-secondary" onclick="showMainMenu()">
              Home
            </button>
            <button
              class="btn btn-info"
              onclick="reviewAnswers()"
              id="reviewBtn"
            >
              Review Answers
            </button>
          </div>
        </div>

        <div id="quizContent"></div>

        <div class="navigation-controls">
          <button
            class="btn btn-secondary"
            onclick="previousGroup()"
            id="prevBtn"
          >
            Previous
          </button>
          <button
            class="btn btn-success"
            onclick="checkCurrentGroup()"
            id="checkBtn"
          >
            Check Answers
          </button>
          <button class="btn btn-primary" onclick="nextGroup()" id="nextBtn">
            Next
          </button>
          <button
            class="btn btn-warning"
            onclick="showResults()"
            id="showResultsBtn"
            style="display: none"
          >
            Show Final Results
          </button>
        </div>
      </div>
    </div>

      // Load the embedded data
      function loadTOEICData() {
        try {
          quizData = embeddedData;
          console.log("TOEIC data loaded successfully");

          if (quizData.length === 0) {
            document.getElementById("loadingMessage").innerHTML =
              '<div class="error">No quiz data available. Please add your TOEIC questions to the embeddedData array.</div>';
          }
        } catch (error) {
          console.error("Error loading TOEIC data:", error);
          document.getElementById("loadingMessage").innerHTML =
            '<div class="error">Error: Could not load quiz data.</div>';
        }
      }

      // Start quiz with specified number of groups (automatically randomized)
      function startQuiz(numGroups) {
        if (quizData.length === 0) {
          alert("Please wait for the data to load...");
          return;
        }

        // Reset everything
        userAnswers = {};
        groupResults = {};
        currentGroupIndex = 0;

        // Select groups in order
        if (numGroups === "all") {
          currentQuiz = [...quizData];
        } else {
          currentQuiz = quizData.slice(0, Math.min(numGroups, quizData.length));
        }

        showQuizInterface();
        displayCurrentGroup();
      }

      // Start quiz with a specific range of groups (1-based index)
      function startQuizRange(fromGroup, toGroup) {
        if (quizData.length === 0) {
          alert("Please wait for the data to load...");
          return;
        }

        // Reset everything
        userAnswers = {};
        groupResults = {};
        currentGroupIndex = 0;

        // Slice by 0-based index (fromGroup and toGroup are 1-based)
        const start = fromGroup - 1;
        const end = Math.min(toGroup, quizData.length);
        currentQuiz = quizData.slice(start, end);

        if (currentQuiz.length === 0) {
          alert("No groups found in that range.");
          return;
        }

        showQuizInterface();
        displayCurrentGroup();
      }

      // Show quiz interface and hide main menu
      function showQuizInterface() {
        document.getElementById("mainMenu").style.display = "none";
        document.getElementById("quizContainer").style.display = "block";
        document.getElementById("allAnswersContainer").style.display = "none";
      }

      // Show main menu and hide all other interfaces
      function showMainMenu() {
        document.getElementById("mainMenu").style.display = "block";
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("allAnswersContainer").style.display = "none";

        // Reset UI state
        document.getElementById("checkBtn").style.display = "inline-block";

      // Show all answers for all groups
      function showAllAnswers() {
        if (quizData.length === 0) {
          alert("Please wait for the data to load...");
          return;
        }

        document.getElementById("mainMenu").style.display = "none";
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("allAnswersContainer").style.display = "block";

        displayAllAnswers();
      }

      // Display all groups with their answers
      function displayAllAnswers() {
        let html = "";

        quizData.forEach((group, groupIndex) => {
          html += `<div class="answer-key-group">`;
          html += `<h3>Group ${group.group_id}</h3>`;

          // Display passage if it exists
          if (group.passage) {
            html += `<div class="passage">${group.passage}</div>`;
          } else if (group.passages) {
            // For multiple passages
            group.passages.forEach((passage, passageIndex) => {
              html += `<div class="passage">`;
              if (passage.title) {
                html += `<h4>${passage.title}</h4>`;
              }
              html += `${passage.content || passage}`;
              html += `</div>`;
            });
          }

          // Display questions with correct answers highlighted
          group.questions.forEach((question, questionIndex) => {
            const correctAnswer = question.correct_answer;
            const correctText = question.options[correctAnswer];

            html += `<div class="answer-key-question">`;
            html += `<h4>Question ${
              question.question_number || questionIndex + 1
            }: ${question.question || ""}</h4>`;
            html += `<div class="options">`;

            Object.entries(question.options).forEach(([key, value]) => {
              const isCorrect = key === correctAnswer;
              const optionClass = isCorrect
                ? "option correct"
                : "option not-selected";

              html += `
                            <div class="${optionClass}">
                                <span><strong>${key}:</strong> ${value}</span>
                                ${isCorrect ? " ✓" : ""}
                            </div>`;
            });

            html += `</div>`;
            html += `<div class="correct-answer">Correct Answer: <strong>${correctAnswer}</strong> - ${correctText}</div>`;
            html += `</div>`;
          });

          html += `</div>`;
        });

        document.getElementById("allAnswersContent").innerHTML = html;
      }

          Object.entries(question.options).forEach(([key, value]) => {
            const isChecked = userAnswers[questionId] === key ? "checked" : "";
            html += `
                        <label class="option" for="${questionId}_${key}">
                            <input type="radio" 
                                   id="${questionId}_${key}" 
                                   name="${questionId}" 
                                   value="${key}"
                                   ${isChecked}
                                   onchange="recordAnswer('${questionId}', '${key}')">
                            <span><strong>${key}:</strong> ${value}</span>
                        </label>`;
          });

          html += `</div></div>`;
        });

        html += `</div>`;
        document.getElementById("quizContent").innerHTML = html;

        // If this group was already checked, show the results
        if (groupResults[currentGroupIndex]) {
          displayGroupResults();
        }
      }

      // Update progress information
      function updateProgressInfo() {
        const progressInfo = document.getElementById("progressInfo");
        progressInfo.textContent = `Group ${currentGroupIndex + 1} of ${
          currentQuiz.length
        }`;
      }

      // Update navigation buttons
      function updateNavigationButtons() {
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const checkBtn = document.getElementById("checkBtn");
        const showResultsBtn = document.getElementById("showResultsBtn");

        prevBtn.style.display =
          currentGroupIndex === 0 ? "none" : "inline-block";

        if (currentGroupIndex === currentQuiz.length - 1) {
          nextBtn.style.display = "none";
          showResultsBtn.style.display = "inline-block";
        } else {
          nextBtn.style.display = "inline-block";
          showResultsBtn.style.display = "none";
        }

        // Show/hide check button based on whether group is already checked
        checkBtn.style.display = groupResults[currentGroupIndex]
          ? "none"
          : "inline-block";
      }

      // Record user's answer
      function recordAnswer(questionId, answer) {
        userAnswers[questionId] = answer;
      }

      // Check answers for current group
      function checkCurrentGroup() {
        const group = currentQuiz[currentGroupIndex];
        let correct = 0;
        let total = group.questions.length;

        group.questions.forEach((question, questionIndex) => {
          const questionId = `q_${currentGroupIndex}_${questionIndex}`;
          const userAnswer = userAnswers[questionId];
          const correctAnswer = question.correct_answer;

          if (userAnswer === correctAnswer) {
            correct++;
          }
        });

        // Store results for this group
        groupResults[currentGroupIndex] = {
          correct: correct,
          total: total,
          percentage: Math.round((correct / total) * 100),
        };

        displayGroupResults();
        updateNavigationButtons();
      }

      // Display results for current group
      function displayGroupResults() {
        const group = currentQuiz[currentGroupIndex];

        group.questions.forEach((question, questionIndex) => {
          const questionId = `q_${currentGroupIndex}_${questionIndex}`;
          const userAnswer = userAnswers[questionId];
          const correctAnswer = question.correct_answer;

          // Highlight options
          Object.keys(question.options).forEach((optionKey) => {
            const optionElement = document.querySelector(
              `label[for="${questionId}_${optionKey}"]`,
            );
            if (optionElement) {
              // Reset classes
              optionElement.classList.remove(
                "correct",
                "incorrect",
                "not-selected",
              );

              if (optionKey === correctAnswer) {
                optionElement.classList.add("correct");
              }

              if (
                userAnswer &&
                optionKey === userAnswer &&
                optionKey !== correctAnswer
              ) {
                optionElement.classList.add("incorrect");
              }

              if (!userAnswer || optionKey !== userAnswer) {
                if (optionKey !== correctAnswer) {
                  optionElement.classList.add("not-selected");
                }
              }
            }
          });
        });

        // Show group result
        const result = groupResults[currentGroupIndex];
        const resultHtml = `
                <div class="results-summary">
                    <h3>Group ${currentGroupIndex + 1} Results</h3>
                    <div class="score">${result.correct}/${result.total}</div>
                    <p>Score: ${result.percentage}%</p>
                </div>`;

        document
          .getElementById("quizContent")
          .insertAdjacentHTML("beforeend", resultHtml);
      }

      // Navigation functions
      function previousGroup() {
        if (currentGroupIndex > 0) {
          currentGroupIndex--;
          displayCurrentGroup();
        }
      }

      function nextGroup() {
        if (currentGroupIndex < currentQuiz.length - 1) {
          currentGroupIndex++;
          displayCurrentGroup();
        }
      }

      // Show final results (automatically check unchecked groups)
      function showResults() {
        // First, automatically check any groups that haven't been checked yet
        for (
          let groupIndex = 0;
          groupIndex < currentQuiz.length;
          groupIndex++
        ) {
          if (!groupResults[groupIndex]) {
            const group = currentQuiz[groupIndex];
            let correct = 0;
            let total = group.questions.length;

            group.questions.forEach((question, questionIndex) => {
              const questionId = `q_${groupIndex}_${questionIndex}`;
              const userAnswer = userAnswers[questionId];
              const correctAnswer = question.correct_answer;

              if (userAnswer === correctAnswer) {
                correct++;
              }
            });

            // Store results for this group
            groupResults[groupIndex] = {
              correct: correct,
              total: total,
              percentage: Math.round((correct / total) * 100),
            };
          }
        }

        let totalCorrect = 0;
        let totalQuestions = 0;

        Object.values(groupResults).forEach((result) => {
          totalCorrect += result.correct;
          totalQuestions += result.total;
        });

        const overallPercentage =
          totalQuestions > 0
            ? Math.round((totalCorrect / totalQuestions) * 100)
            : 0;

        let html = `
                <div class="results-summary">
                    <h3>Final Results</h3>
                    <div class="score">${totalCorrect}/${totalQuestions}</div>
                    <p>Overall Score: ${overallPercentage}%</p>
                    <p>${getScoreMessage(overallPercentage)}</p>
                </div>

                <div class="question-group">
                    <h3>Group Breakdown</h3>`;

        Object.entries(groupResults).forEach(([groupIndex, result]) => {
          const group = currentQuiz[parseInt(groupIndex)];
          html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: white; margin: 5px 0; border-radius: 5px;">
                        <span><strong>Group ${
                          parseInt(groupIndex) + 1
                        }</strong></span>
                        <span><strong>${result.correct}/${
                          result.total
                        }</strong> (${result.percentage}%)</span>
                    </div>`;
        });

        html += `</div>`;
        document.getElementById("quizContent").innerHTML = html;

        // Update navigation
        document.getElementById("prevBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("checkBtn").style.display = "none";
        document.getElementById("showResultsBtn").style.display = "none";
      }

      // Review all answers
      function reviewAnswers() {
        currentGroupIndex = 0;
        displayCurrentGroup();
      }

      // Get score message based on percentage
      function getScoreMessage(percentage) {
        if (percentage >= 90)
          return "Excellent! You're well prepared for the TOEIC!";
        if (percentage >= 80)
          return "Great job! You have a solid understanding.";
        if (percentage >= 70) return "Good work! Keep practicing to improve.";
        if (percentage >= 60) return "Not bad! Focus on areas you missed.";
        return "Keep studying! Practice makes perfect.";
      }

      // Initialize the application
      window.addEventListener("DOMContentLoaded", loadTOEICData);
    </script>
  </body>
</html>
