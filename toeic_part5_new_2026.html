<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>TOEIC Part 5 · Luyện ngữ pháp</title>
  <style>
    :root {
      --navy: #14213d;
      --navy-light: #1f2f52;
      --gold: #e8a33d;
      --gold-soft: #fde9c8;
      --cream: #fbf8f2;
      --ink: #1a1a1a;
      --muted: #6b7280;
      --correct: #2f9e64;
      --wrong: #d64545;
      --card-radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--navy);
      background-image:
        radial-gradient(circle at 15% 8%, rgba(232, 163, 61, 0.18), transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(232, 163, 61, 0.10), transparent 45%);
      font-family: 'Georgia', 'Iowan Old Style', serif;
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.35);
    }

    header {
      background: var(--navy);
      color: var(--gold-soft);
      padding: 18px 20px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 22px;
      margin: 0;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .score-pill {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: rgba(232, 163, 61, 0.15);
      border: 1px solid rgba(232, 163, 61, 0.4);
      color: var(--gold-soft);
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .back-btn {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: none;
      border: none;
      color: var(--gold-soft);
      font-size: 13px;
      padding: 0;
      margin-bottom: 8px;
      cursor: pointer;
      opacity: 0.85;
      display: none;
    }

    .back-btn.show {
      display: inline-block;
    }

    .progress-track {
      margin-top: 14px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), #f4c568);
      width: 0%;
      transition: width 0.4s ease;
    }

    main {
      flex: 1;
      padding: 22px 20px 40px;
    }

    .set-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .set-card {
      background: #fff;
      border: 1.5px solid #e3ddd0;
      border-radius: 14px;
      padding: 16px 14px;
      text-align: left;
      cursor: pointer;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      transition: border-color 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .set-card:active {
      transform: scale(0.97);
    }

    .set-card.locked {
      opacity: 0.5;
      cursor: default;
    }

    .set-card .set-label {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .set-card .set-name {
      font-family: 'Georgia', serif;
      font-size: 20px;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .set-card .set-range {
      font-size: 12px;
      color: var(--muted);
    }

    .set-card .set-score {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--correct);
    }

    .set-card.locked .set-score {
      color: var(--muted);
    }

    .home-intro {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .qnum {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: var(--gold);
      background: var(--navy);
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    .question-card {
      background: #fff;
      border-radius: var(--card-radius);
      padding: 22px 20px;
      box-shadow: 0 6px 20px rgba(20, 33, 61, 0.08);
      border: 1px solid rgba(20, 33, 61, 0.06);
    }

    .sentence {
      font-size: 19px;
      line-height: 1.55;
      margin: 0 0 22px;
      color: var(--navy);
    }

    .sentence .gap {
      display: inline-block;
      min-width: 64px;
      border-bottom: 2px dashed var(--gold);
      text-align: center;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: left;
      border: 1.5px solid #e3ddd0;
      background: var(--cream);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 16px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .opt:active {
      transform: scale(0.98);
    }

    .opt .letter {
      font-weight: 700;
      color: var(--navy);
      background: #fff;
      border: 1.5px solid #e3ddd0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .opt.correct {
      background: #eaf7ef;
      border-color: var(--correct);
    }

    .opt.correct .letter {
      background: var(--correct);
      border-color: var(--correct);
      color: #fff;
    }

    .opt.wrong {
      background: #fbebea;
      border-color: var(--wrong);
    }

    .opt.wrong .letter {
      background: var(--wrong);
      border-color: var(--wrong);
      color: #fff;
    }

    .opt.disabled {
      cursor: default;
    }

    .opt.fade {
      opacity: 0.5;
    }

    .explain {
      margin-top: 18px;
      background: var(--gold-soft);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 14.5px;
      line-height: 1.55;
      color: #4a3418;
      display: none;
    }

    .explain.show {
      display: block;
      animation: slideDown 0.25s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .explain b {
      color: var(--navy);
    }

    .explain .tip {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(74, 52, 24, 0.25);
      font-style: italic;
    }

    .tag {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--navy);
      background: rgba(20, 33, 61, 0.08);
      padding: 2px 8px;
      border-radius: 5px;
      margin-bottom: 8px;
      display: inline-block;
    }

    .nav-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .nav-btn {
      flex: 1;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 13px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .nav-btn:active {
      opacity: 0.85;
    }

    .nav-btn.primary {
      background: var(--navy);
      color: var(--gold-soft);
    }

    .nav-btn.ghost {
      background: transparent;
      color: var(--navy);
      border: 1.5px solid #d8d2c4;
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .result {
      text-align: center;
      padding-top: 30px;
    }

    .result .big {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 56px;
      font-weight: 700;
      color: var(--navy);
      margin: 10px 0 0;
    }

    .result .of {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 24px;
    }

    .result-msg {
      font-size: 17px;
      color: var(--navy);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    footer {
      text-align: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      color: rgba(20, 33, 61, 0.35);
      padding: 16px 0 28px;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <button class="back-btn" id="backBtn">← Tất cả đề</button>
      <div class="brand">TOEIC · PART 5</div>
      <div class="title-row">
        <h1 id="headerTitle">Chọn đề</h1>
        <div class="score-pill" id="scorePill" style="display:none;">0 / 0</div>
      </div>
      <div class="progress-track" id="progressTrack" style="display:none;">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </header>

    <main>
      <div id="homeView">
        <p class="home-intro">Chọn một đề để bắt đầu luyện. Mỗi đề có 30 câu (đáp án đúng + giải thích ngữ pháp + mẹo
          nhớ cho mỗi câu).</p>
        <div class="set-grid" id="setGrid"></div>
      </div>

      <div id="quizView" style="display:none;">
        <div class="qnum" id="qnum">CÂU 101</div>
        <div class="question-card">
          <p class="sentence" id="sentence"></p>
          <div class="options" id="options"></div>
          <div class="explain" id="explain"></div>
        </div>

        <div class="nav-row">
          <button class="nav-btn ghost" id="prevBtn">← Câu trước</button>
          <button class="nav-btn primary" id="nextBtn">Câu tiếp →</button>
        </div>
      </div>

      <div id="resultView" class="result" style="display:none;">
        <div class="brand" style="text-align:center;">KẾT QUẢ</div>
        <div class="big" id="resultScore">0/0</div>
        <div class="of">câu trả lời đúng ngay lần đầu</div>
        <div class="result-msg" id="resultMsg"></div>
        <div class="result-actions">
          <button class="nav-btn primary" id="retryBtn">Làm lại đề này</button>
          <button class="nav-btn ghost" id="homeBtn">Về danh sách đề</button>
        </div>
      </div>
    </main>

    <footer>Chạm vào 1 đáp án để xem giải thích · Vuốt hoặc bấm để chuyển câu</footer>
  </div>

  <script>
    /* ===================== DATA: SETS ===================== */
    const SETS = [
      {
        id: 1,
        name: "Đề 1",
        range: "101–130",
        questions: [
          {
            num: 101,
            sentence: "Emily introduced &mdash;&mdash;&mdash; before starting the interview for the management job.",
            options: ["she", "herself", "hers", "her"],
            correct: 1,
            tag: "Đại từ phản thân (Reflexive Pronoun)",
            explain: "Chủ ngữ <b>Emily</b> và tân ngữ của động từ <b>introduced</b> là cùng một người &rarr; dùng đại từ phản thân <b>herself</b>.",
            tip: "Introduce oneself = tự giới thiệu. Chủ ngữ và tân ngữ là một người → dùng '-self/-selves'."
          },
          {
            num: 102,
            sentence: "&mdash;&mdash;&mdash; to the e-mail from the supervisor as soon as possible and ask questions if anything is unclear.",
            options: ["Response", "Responding", "Respond", "Responds"],
            correct: 2,
            tag: "Câu mệnh lệnh (Imperative)",
            explain: "Câu bắt đầu bằng khoảng trống, không có chủ ngữ rõ ràng, nối với 'and ask' (động từ nguyên thể) &rarr; đây là câu mệnh lệnh, cần động từ nguyên thể <b>Respond</b>.",
            tip: "Câu mệnh lệnh luôn bắt đầu bằng động từ nguyên thể (V), không chia thì, không thêm -s/-ing."
          },
          {
            num: 103,
            sentence: "The &mdash;&mdash;&mdash; of the retreat was to allow all of the employees to bond with one another.",
            options: ["measure", "convention", "scheme", "purpose"],
            correct: 3,
            tag: "Từ vựng danh từ",
            explain: "Câu nói về <b>mục đích</b> của buổi retreat (to allow... to bond) &rarr; <b>purpose</b> (mục đích) phù hợp nhất về nghĩa.",
            tip: "The purpose of X was to... là cấu trúc rất quen thuộc trong TOEIC khi nói về mục đích của một hoạt động/sự kiện."
          },
          {
            num: 104,
            sentence: "The wildlife preserve was created by the Florida Nature Commission to &mdash;&mdash;&mdash; the state's endangered species.",
            options: ["protect", "protection", "protective", "protecting"],
            correct: 0,
            tag: "To + V (mục đích)",
            explain: "Sau <b>to</b> chỉ mục đích cần một động từ nguyên thể &rarr; <b>protect</b> (bảo vệ).",
            tip: "'to + V' diễn tả mục đích (in order to) luôn cần động từ nguyên thể, không phải danh từ hay tính từ."
          },
          {
            num: 105,
            sentence: "Staff members with &mdash;&mdash;&mdash; engagements need not feel obliged to attend next week's field trip.",
            options: ["prior", "timely", "late", "old"],
            correct: 0,
            tag: "Từ vựng tính từ",
            explain: "<b>prior engagements</b> = những cam kết/lịch hẹn đã có từ trước &rarr; phù hợp nghĩa 'không cần tham gia nếu đã có lịch hẹn trước'.",
            tip: "Cụm cố định: 'prior engagement/commitment' = lịch hẹn đã có từ trước, rất hay gặp trong email công sở."
          },
          {
            num: 106,
            sentence: "The building's new tenants &mdash;&mdash;&mdash; in the next couple of days, so the staff is getting everything ready.",
            options: ["to arrive", "have arrived", "are arriving", "arrival"],
            correct: 2,
            tag: "Hiện tại tiếp diễn cho tương lai gần",
            explain: "'in the next couple of days' chỉ tương lai gần, mệnh đề sau 'so' đang diễn tả sự chuẩn bị &rarr; dùng hiện tại tiếp diễn <b>are arriving</b> diễn tả kế hoạch đã định trong tương lai gần.",
            tip: "Thì hiện tại tiếp diễn (am/is/are + V-ing) thường được dùng để nói về kế hoạch/lịch trình đã sắp xếp trong tương lai gần."
          },
          {
            num: 107,
            sentence: "The banquet hall was &mdash;&mdash;&mdash; decorated for the fund-raising gala on June 11.",
            options: ["elaborated", "elaborately", "elaborate", "elaborator"],
            correct: 1,
            tag: "Trạng từ bổ nghĩa cho động từ bị động",
            explain: "Từ cần điền bổ nghĩa cho động từ bị động <b>decorated</b> (được trang trí như thế nào) &rarr; cần trạng từ <b>elaborately</b> (một cách tinh xảo, cầu kỳ).",
            tip: "was/were + [TRẠNG TỪ] + V-ed/V3: trạng từ luôn chen vào giữa 'be' và động từ phân từ trong câu bị động."
          },
          {
            num: 108,
            sentence: "The Whitby Town Council recently prepared a brochure recommending ways that residents can play an &mdash;&mdash;&mdash; role in the community.",
            options: ["activate", "active", "action", "activity"],
            correct: 1,
            tag: "Tính từ đứng trước danh từ",
            explain: "Từ cần điền đứng giữa 'an' và danh từ <b>role</b> &rarr; cần tính từ <b>active</b> (an active role = vai trò tích cực/chủ động).",
            tip: "Sau mạo từ (a/an/the) và trước danh từ, vị trí đó luôn cần TÍNH TỪ để bổ nghĩa cho danh từ."
          },
          {
            num: 109,
            sentence: "Ms. Johnson &mdash;&mdash;&mdash; a feasible solution to the customer's network problem.",
            options: ["came up with", "dropped by", "looked in on", "ran out of"],
            correct: 0,
            tag: "Cụm động từ (Phrasal Verb)",
            explain: "<b>came up with</b> = nghĩ ra, đưa ra (giải pháp) &rarr; phù hợp nghĩa 'Ms. Johnson đã nghĩ ra một giải pháp khả thi'.",
            tip: "come up with = nghĩ ra ý tưởng/giải pháp. Đây là cụm động từ rất thường gặp trong TOEIC Part 5, 6."
          },
          {
            num: 110,
            sentence: "The human resources department is &mdash;&mdash;&mdash; pressure to find a replacement for the senior accountant.",
            options: ["within", "through", "under", "among"],
            correct: 2,
            tag: "Giới từ cố định",
            explain: "<b>under pressure</b> = chịu áp lực &rarr; đây là cụm giới từ cố định, nghĩa phù hợp với câu.",
            tip: "Cụm cố định 'under pressure' (chịu áp lực) nên học thuộc như một unit, không suy luận nghĩa từng từ."
          },
          {
            num: 111,
            sentence: "BelTrax has &mdash;&mdash;&mdash; ranked as one of the top providers of marketing research since its foundation seven years ago.",
            options: ["conveniently", "temporarily", "consistently", "wishfully"],
            correct: 2,
            tag: "Trạng từ bổ nghĩa cho động từ bị động",
            explain: "'since its foundation seven years ago' cho biết hành động diễn ra liên tục, đều đặn suốt 7 năm &rarr; <b>consistently</b> (một cách nhất quán, liên tục) phù hợp nghĩa nhất.",
            tip: "Khi câu có mốc thời gian dài ('since... years ago'), ưu tiên trạng từ chỉ tính liên tục/ổn định như consistently, constantly."
          },
          {
            num: 112,
            sentence: "Mansfield Chemical built an extension that &mdash;&mdash;&mdash; additional space for the newly purchased machinery.",
            options: ["will have furnished", "would furnish", "had furnished", "to furnish"],
            correct: 1,
            tag: "Tương lai trong quá khứ (Future in the past)",
            explain: "Hành động 'built an extension' đã xảy ra trong quá khứ, mệnh đề quan hệ 'that...' diễn tả kết quả/mục đích SAU thời điểm đó nhưng nhìn từ quá khứ &rarr; dùng <b>would + V</b> &rarr; <b>would furnish</b>.",
            tip: "'Would + V' diễn tả một việc được dự tính xảy ra SAU một hành động đã xảy ra trong quá khứ — giống 'will' nhưng lùi về quá khứ."
          },
          {
            num: 113,
            sentence: "As the argument raised at the last meeting was on a &mdash;&mdash;&mdash; point, it did not affect the proposal's overall plan.",
            options: ["defensive", "creative", "minor", "critical"],
            correct: 2,
            tag: "Từ vựng tính từ (theo logic câu)",
            explain: "Mệnh đề sau 'it did not affect... overall plan' cho biết vấn đề đó không quan trọng &rarr; <b>minor</b> (nhỏ, không đáng kể) phù hợp nghĩa nhất.",
            tip: "Chú ý mối liên hệ nhân-quả trong câu: 'không ảnh hưởng lớn' → điểm được nhắc tới phải là điểm NHỎ/không quan trọng."
          },
          {
            num: 114,
            sentence: "&mdash;&mdash;&mdash; who still wish to submit applications after the deadline must pay a $45 late fee in order to be considered.",
            options: ["Anyone", "Those", "Though", "Seldom"],
            correct: 1,
            tag: "Đại từ + mệnh đề quan hệ",
            explain: "Cấu trúc '<b>Those who</b> + V' = 'những người mà...' rất phổ biến để chỉ một nhóm người chưa xác định, theo sau bởi mệnh đề quan hệ 'who still wish...'.",
            tip: "'Those who' là cách chuẩn để nói về một nhóm người chung khi theo sau là mệnh đề quan hệ 'who'."
          },

            "explain": "Do doanh số giảm, công ty quyết định <b>discontinue</b> (ngừng sản xuất) dòng xe M5 &rarr; phù hợp nghĩa nhất với việc phản ứng lại tình trạng kinh doanh không tốt bằng cách dừng một sản phẩm.",
            "tip": "'discontinue a product line' = ngừng sản xuất một dòng sản phẩm — động từ rất phổ biến trong ngữ cảnh kinh doanh khi công ty quyết định dừng một sản phẩm không còn hiệu quả."
          },
          {
            "num": 126,
            "sentence": "The Chicago Herald gives a 40 percent discount to existing &mdash;&mdash;&mdash; who sign up for access to its online edition.",
            "options": ["subscription", "subscribed", "subscribes", "subscribers"],
            "correct": 3,
            "tag": "Danh từ chỉ người làm chủ ngữ",
            "explain": "Từ cần điền là chủ ngữ của mệnh đề quan hệ 'who sign up' (số nhiều) &rarr; cần danh từ chỉ NGƯỜI <b>subscribers</b> (người đăng ký) &rarr; 'existing subscribers who sign up' = những người đăng ký hiện tại mà đăng ký thêm.",
            "tip": "'existing subscribers' = những người đăng ký hiện tại — danh từ chỉ người, số nhiều, phù hợp với mệnh đề quan hệ 'who sign up' theo sau."
          },
          {
            "num": 127,
            "sentence": "Sunny River Vacations endeavors to satisfy every customer by personalizing travel details to ensure that each trip is &mdash;&mdash;&mdash;.",
            "options": ["memory", "memorable", "memorizing", "memorials"],
            "correct": 1,
            "tag": "Tính từ bổ ngữ cho chủ ngữ",
            "explain": "Chủ ngữ 'each trip' (mỗi chuyến đi) cần một tính từ bổ ngữ, đứng sau 'is' &rarr; cần tính từ <b>memorable</b> (đáng nhớ) &rarr; 'each trip is memorable' = mỗi chuyến đi đều đáng nhớ.",
            "tip": "'S + is/are + [TÍNH TỪ]' = (chủ ngữ) là/có tính chất như thế nào — sau động từ 'to be', cần tính từ để mô tả đặc điểm của chủ ngữ, không phải danh từ."
          },
          {
            "num": 128,
            "sentence": "Rowan Training Center has added more business classes, which brings the total number of &mdash;&mdash;&mdash; sessions to nearly double that of last year.",
            "options": ["schedule", "scheduled", "schedules", "scheduling"],
            "correct": 1,
            "tag": "Phân từ làm tính từ (Past Participle as Adjective)",
            "explain": "Từ cần điền đứng trước danh từ <b>sessions</b>, mang nghĩa bị động (các buổi học ĐƯỢC lên lịch) &rarr; <b>scheduled</b> phù hợp &rarr; 'the total number of scheduled sessions' = tổng số buổi học đã được lên lịch.",
            "tip": "'scheduled sessions/classes' = các buổi học/lớp đã được lên lịch — phân từ hai (V3/V-ed) làm tính từ, mang nghĩa bị động khi mô tả các hoạt động đã được sắp xếp trước."
          },
          {
            "num": 129,
            "sentence": "Ms. Jacobs' managerial style is democratic &mdash;&mdash;&mdash; she includes her staff in the decision-making process.",
            "options": ["in that", "for example", "so that", "rather than"],
            "correct": 0,
            "tag": "Liên từ giải thích 'in that'",
            "explain": "<b>in that + mệnh đề</b> = ở chỗ, bởi vì (giải thích cụ thể) &rarr; 'democratic in that she includes her staff' = dân chủ ở chỗ cô ấy để nhân viên tham gia quyết định, phù hợp nghĩa giải thích lý do/cách thức phong cách đó dân chủ.",
            "tip": "'in that + mệnh đề' = ở chỗ, bởi vì — liên từ dùng để giải thích cụ thể lý do/cách thức một đặc điểm được nêu trước đó thể hiện ra sao."
          },
          {
            "num": 130,
            "sentence": "MFG Electronics has a page on its Web site dedicated to &mdash;&mdash;&mdash; from users of its products.",
            "options": ["licenses", "testimonials", "accomplishments", "tendencies"],
            "correct": 1,
            "tag": "Từ vựng danh từ",
            "explain": "Trang web có một mục dành cho <b>testimonials</b> (lời chứng thực, đánh giá) từ người dùng sản phẩm &rarr; phù hợp nghĩa nhất với việc thu thập phản hồi/đánh giá của khách hàng.",
            "tip": "'testimonials from users' = lời chứng thực/đánh giá từ người dùng — danh từ rất phổ biến trên trang web công ty khi trưng bày phản hồi tích cực của khách hàng về sản phẩm."
          }
        ]
      }
      // 👉 THÊM ĐỀ MỚI: dán dấu phẩy "," ngay sau dòng "}" phía trên,
      // rồi dán object đề mới của bạn vào ngay trước dòng "];" dưới đây.
    ];

    /* ===================== STATE ===================== */
    let currentSetIndex = null;
    let current = 0;
    let answered = [];
    let correctCount = 0;
    const memoryScores = {};

    /* ===================== DOM REFS ===================== */
    const homeView = document.getElementById('homeView');
    const quizView = document.getElementById('quizView');
    const resultView = document.getElementById('resultView');
    const setGrid = document.getElementById('setGrid');
    const backBtn = document.getElementById('backBtn');
    const headerTitle = document.getElementById('headerTitle');
    const scorePillEl = document.getElementById('scorePill');
    const progressTrackEl = document.getElementById('progressTrack');
    const progressFillEl = document.getElementById('progressFill');

    const sentenceEl = document.getElementById('sentence');
    const optionsEl = document.getElementById('options');
    const explainEl = document.getElementById('explain');
    const qnumEl = document.getElementById('qnum');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    /* ===================== HOME SCREEN ===================== */
    function buildHome() {
      setGrid.innerHTML = '';
      SETS.forEach((set, i) => {
        const card = document.createElement('button');
        card.className = 'set-card';
        const savedScore = memoryScores.hasOwnProperty(set.id) ? memoryScores[set.id] : null;
        card.innerHTML =
          '<div class="set-label">' + set.range + '</div>' +
          '<div class="set-name">' + set.name + '</div>' +
          '<div class="set-range">' + set.questions.length + ' câu</div>' +
          (savedScore !== null ? '<div class="set-score">Đã làm: ' + savedScore + '/' + set.questions.length + '</div>' : '');
        card.addEventListener('click', () => openSet(i));
        setGrid.appendChild(card);
      });
    }

    function showHome() {
      currentSetIndex = null;
      homeView.style.display = 'block';
      quizView.style.display = 'none';
      resultView.style.display = 'none';
      backBtn.classList.remove('show');
      headerTitle.textContent = 'Chọn đề';
      scorePillEl.style.display = 'none';
      progressTrackEl.style.display = 'none';
      buildHome();
    }

    function openSet(index) {
      currentSetIndex = index;
      const set = SETS[index];
      answered = new Array(set.questions.length).fill(null);
      current = 0;
      homeView.style.display = 'none';
      resultView.style.display = 'none';
      quizView.style.display = 'block';
      backBtn.classList.add('show');
      headerTitle.textContent = set.name;
      scorePillEl.style.display = 'inline-block';
      progressTrackEl.style.display = 'block';
      render();
    }

    backBtn.addEventListener('click', showHome);
    document.getElementById('homeBtn').addEventListener('click', showHome);

    /* ===================== QUIZ LOGIC ===================== */
    function updateScore() {
      const set = SETS[currentSetIndex];
      correctCount = answered.filter((a, i) => a !== null && a === set.questions[i].correct).length;
      const attempted = answered.filter(a => a !== null).length;
      scorePillEl.textContent = correctCount + ' / ' + attempted;
      const pct = (attempted / set.questions.length) * 100;
      progressFillEl.style.width = pct + '%';
    }

    function render() {
      const set = SETS[currentSetIndex];
      const q = set.questions[current];
      qnumEl.textContent = 'CÂU ' + q.num;
      sentenceEl.innerHTML = q.sentence.replace('&mdash;&mdash;&mdash;', '<span class="gap">&nbsp;</span>');

      optionsEl.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + opt + '</span>';
        btn.addEventListener('click', () => selectOption(i));
        optionsEl.appendChild(btn);
      });

      explainEl.className = 'explain';
      explainEl.innerHTML = '';

      const chosen = answered[current];
      if (chosen !== null) {
        revealAnswer(chosen);
      }

      prevBtn.disabled = current === 0;
      nextBtn.textContent = current === set.questions.length - 1 ? 'Xem kết quả →' : 'Câu tiếp →';

      updateScore();
    }

    function selectOption(i) {
      if (answered[current] !== null) return;
      answered[current] = i;
      revealAnswer(i);
      updateScore();
    }

    function revealAnswer(chosenIndex) {
      const set = SETS[currentSetIndex];
      const q = set.questions[current];
      const opts = optionsEl.children;
      for (let i = 0; i < opts.length; i++) {
        opts[i].classList.add('disabled');
        if (i === q.correct) {
          opts[i].classList.add('correct');
        } else if (i === chosenIndex) {
          opts[i].classList.add('wrong');
        } else {
          opts[i].classList.add('fade');
        }
      }
      explainEl.innerHTML =
        '<span class="tag">' + q.tag + '</span><br>' +
        q.explain +
        '<div class="tip">💡 ' + q.tip + '</div>';
      explainEl.classList.add('show');
    }

    prevBtn.addEventListener('click', () => {
      if (current > 0) { current--; render(); }
    });

    nextBtn.addEventListener('click', () => {
      const set = SETS[currentSetIndex];
      if (current < set.questions.length - 1) {
        current++;
        render();
      } else {
        showResult();
      }
    });

    function showResult() {
      const set = SETS[currentSetIndex];
      quizView.style.display = 'none';
      resultView.style.display = 'block';
      progressTrackEl.style.display = 'none';
      updateScore();
      memoryScores[set.id] = correctCount;
      document.getElementById('resultScore').textContent = correctCount + '/' + set.questions.length;

      let msg = '';
      const pct = correctCount / set.questions.length;
      if (pct === 1) msg = 'Xuất sắc! Bạn nắm rất vững đề này 🎉';
      else if (pct >= 0.7) msg = 'Khá tốt! Xem lại vài câu sai để nắm chắc hơn nhé.';
      else msg = 'Cứ luyện tiếp! Đọc kỹ phần giải thích và mẹo nhớ ở mỗi câu.';
      document.getElementById('resultMsg').textContent = msg;
    }

    document.getElementById('retryBtn').addEventListener('click', () => {
      openSet(currentSetIndex);
    });

    /* Vuốt để chuyển câu (mobile) */
    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
    document.addEventListener('touchend', e => {
      if (quizView.style.display === 'none') return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      const set = SETS[currentSetIndex];
      if (Math.abs(dx) > 60) {
        if (dx < 0 && current < set.questions.length - 1) { current++; render(); }
        else if (dx > 0 && current > 0) { current--; render(); }
      }
    });

    /* ===================== INIT ===================== */
    showHome();
  </script>
</body>

</html>
