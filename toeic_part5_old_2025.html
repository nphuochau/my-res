<!doctype html>
<html lang="vi">

      * {

        padding: 0;

        padding: 30px;

      }

      }

      .header p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .main-menu {
        padding: 40px;
        text-align: center;
      }

      .menu-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 30px;
      }

      .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 25px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      .btn-secondary {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }

      .quiz-options {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .quiz-container {
        padding: 40px;
        display: none;
      }

      .question-card {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      .question-number {
        color: #667eea;
        font-weight: bold;
        font-size: 1.1rem;
        margin-bottom: 15px;
      }

      .question-text {
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 20px;
        color: #333;
      }

      .options {
        display: grid;
        gap: 10px;
      }

      .option {
        background: white;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        padding: 12px 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1rem;
      }

      .option:hover {
        border-color: #667eea;
        background: #f8f9ff;
      }

      .option.selected {
        border-color: #667eea;
        background: #667eea;
        color: white;
      }

      .option.correct {
        border-color: #28a745;
        background: #28a745;
        color: white;
      }

      .option.incorrect {
        border-color: #dc3545;
        background: #dc3545;
        color: white;
      }

      .quiz-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 30px 0;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 10px;
      }

      .progress {
        text-align: center;
        color: #667eea;
        font-weight: bold;
      }

      .results {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 30px;
        margin-top: 30px;
        text-align: center;
      }

      .score {
        font-size: 2rem;
        color: #667eea;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .view-all {
        display: none;
        padding: 40px;
      }

      .questions-grid {
        display: grid;
        gap: 20px;
      }

      .question-item {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        border-left: 4px solid #667eea;
      }

      .correct-answer {
        color: #28a745;
        font-weight: bold;
        margin-top: 10px;
      }

      .back-btn {
        margin-bottom: 20px;
      }

      @media (max-width: 768px) {
        body {
          padding: 8px;
        }
        .header h1 {
          font-size: 2rem;
        }

        .menu-buttons {
          flex-direction: column;
          align-items: center;
        }

        .btn {
          width: 100%;
          max-width: 300px;
        }
        .view-all {
          padding: 8px;
        }
        .question-item {

          {

            correct: 0,

          {

          {
            number: 180,
            text: "It is easy to read Sam because he _______ squints when he finds himself in an uncomfortable situation.",

      };

      // Global variables
      let currentQuiz = [];
      let currentQuestionIndex = 0;
      let userAnswers = [];
      let isReviewMode = false;

      // Event listeners
      document.addEventListener("DOMContentLoaded", function () {
        // Main menu buttons
        document
          .getElementById("viewAllBtn")
          .addEventListener("click", showAllQuestions);
        document
          .getElementById("quiz1to40Btn")
          .addEventListener("click", () => startQuiz(0, 40));
        document
          .getElementById("quiz41to80Btn")
          .addEventListener("click", () => startQuiz(40, 80));
        document
          .getElementById("quiz80Btn")
          .addEventListener("click", () => startQuiz(0, 80));

        // Quiz control buttons
        document.getElementById("homeBtn").addEventListener("click", goHome);
        document
          .getElementById("submitBtn")
          .addEventListener("click", submitQuiz);
        document
          .getElementById("prevBtn")
          .addEventListener("click", previousQuestion);
        document
          .getElementById("nextBtn")
          .addEventListener("click", nextQuestion);
        document
          .getElementById("reviewBtn")
          .addEventListener("click", reviewAnswers);
        document.getElementById("backBtn").addEventListener("click", goHome);
      });

      // Functions
      function startQuiz(startIndex, endIndex) {
        currentQuiz = questionsData.questions.slice(startIndex, endIndex);
        currentQuestionIndex = 0;
        userAnswers = new Array(currentQuiz.length).fill(-1);
        isReviewMode = false;

        document.getElementById("mainMenu").style.display = "none";
        document.getElementById("viewAll").style.display = "none";
        document.getElementById("quizContainer").style.display = "block";
        document.getElementById("results").style.display = "none";

        displayQuestion();
      }

      function displayQuestion() {
        const question = currentQuiz[currentQuestionIndex];
        const container = document.getElementById("questionContainer");

        container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Câu ${
                      currentQuestionIndex + 1
                    } (Số ${question.number})</div>
                    <div class="question-text">${question.text}</div>
                    <div class="options">
                        ${question.options
                          .map(
                            (option, index) => `
                            <div class="option ${
                              userAnswers[currentQuestionIndex] === index
                                ? "selected"
                                : ""
                            } 
                                ${
                                  isReviewMode
                                    ? index === question.correct
                                      ? "correct"
                                      : userAnswers[currentQuestionIndex] ===
                                            index && index !== question.correct
                                        ? "incorrect"
                                        : ""
                                    : ""
                                }"
                                data-index="${index}">
                                ${option}
                            </div>
                        `,
                          )
                          .join("")}
                    </div>
                    ${
                      isReviewMode
                        ? `<div class="correct-answer">✅ Đáp án đúng: ${
                            question.options[question.correct]
                          }</div>`
                        : ""
                    }
                </div>
            `;

        // Add click listeners to options
        if (!isReviewMode) {
          const options = container.querySelectorAll(".option");
          options.forEach((option) => {
            option.addEventListener("click", function () {
              const index = parseInt(this.dataset.index);
              selectAnswer(index);
            });
          });
        }

        updateProgress();
        updateNavigationButtons();
      }

      function selectAnswer(answerIndex) {
        if (isReviewMode) return;

        userAnswers[currentQuestionIndex] = answerIndex;

        const options = document.querySelectorAll(".option");
        options.forEach((option, index) => {
          option.classList.toggle("selected", index === answerIndex);
        });
      }

      function nextQuestion() {
        if (currentQuestionIndex < currentQuiz.length - 1) {
          currentQuestionIndex++;
          displayQuestion();
        }
      }

      function previousQuestion() {
        if (currentQuestionIndex > 0) {
          currentQuestionIndex--;
          displayQuestion();
        }
      }

      function updateProgress() {
        document.getElementById("progress").textContent = `Câu ${
          currentQuestionIndex + 1
        } / ${currentQuiz.length}`;
      }

      function updateNavigationButtons() {
        document.getElementById("prevBtn").style.display =
          currentQuestionIndex > 0 ? "block" : "none";

        if (!isReviewMode) {
          document.getElementById("nextBtn").style.display =
            currentQuestionIndex < currentQuiz.length - 1 ? "block" : "none";
          document.getElementById("submitBtn").style.display =
            currentQuestionIndex === currentQuiz.length - 1 ? "block" : "none";
        } else {
          document.getElementById("nextBtn").style.display =
            currentQuestionIndex < currentQuiz.length - 1 ? "block" : "none";
          document.getElementById("submitBtn").style.display = "none";
        }
      }

      function submitQuiz() {
        let correctAnswers = 0;

        currentQuiz.forEach((question, index) => {
          if (userAnswers[index] === question.correct) {
            correctAnswers++;
          }
        });

        const percentage = Math.round(
          (correctAnswers / currentQuiz.length) * 100,
        );

        document.getElementById("scoreText").textContent =
          `${correctAnswers}/${currentQuiz.length} (${percentage}%)`;

        let message = "";
        if (percentage >= 90) {
          message = "🏆 Xuất sắc! Bạn có trình độ TOEIC rất cao!";
        } else if (percentage >= 80) {
          message = "🎉 Tốt lắm! Bạn đã làm bài rất tốt!";
        } else if (percentage >= 70) {
          message = "👍 Khá tốt! Hãy tiếp tục luyện tập!";
        } else if (percentage >= 60) {
          message = "📚 Cần cải thiện thêm. Hãy ôn luyện nhiều hơn!";
        } else {
          message = "💪 Đừng bỏ cuộc! Hãy luyện tập thêm!";
        }

        document.getElementById("resultMessage").textContent = message;
        document.getElementById("results").style.display = "block";
      }

      function reviewAnswers() {
        isReviewMode = true;
        currentQuestionIndex = 0;
        document.getElementById("results").style.display = "none";
        displayQuestion();
      }

      function showAllQuestions() {
        document.getElementById("mainMenu").style.display = "none";
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("viewAll").style.display = "block";

        const grid = document.getElementById("questionsGrid");
        grid.innerHTML = questionsData.questions
          .map(
            (question) => `
                <div class="question-item">
                    <div class="question-number">Câu ${question.number}</div>
                    <div class="question-text">${question.text}</div>
                    <div class="options" style="margin-top: 15px;">
                        ${question.options
                          .map(
                            (option, index) => `
                            <div class="option ${
                              index === question.correct ? "correct" : ""
                            }" style="margin-bottom: 5px;">
                                ${option}
                            </div>
                        `,
                          )
                          .join("")}
                    </div>
                    <div class="correct-answer">✅ Đáp án: ${
                      question.options[question.correct]
                    }</div>
                </div>
            `,
          )
          .join("");
      }

      function goHome() {
        document.getElementById("mainMenu").style.display = "block";
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("viewAll").style.display = "none";
      }
    </script>
  </body>
</html>
